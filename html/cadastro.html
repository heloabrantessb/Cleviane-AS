<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="forms.css" rel="stylesheet" type="text/css" />
  <link href="global.css" rel="stylesheet" type="text/css" />
  <title>Cadastro</title>
</head>
<body>
  <main>
    <form>
      <h2>Cadastre-se</h2>
      <div class="input-section">
        
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>
        
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>

        <div class="password-checkbox">
          <label for="checkbox">Lembrar-me</label>
          <input type="checkbox" id="checkbox" name="checkbox" required>
        </div>
      </div>

      <input type="submit" value="Crie sua conta">
      <p>Ou se cadastre com :</p>
      <!-- FOTINHO DA LOGO DO GMAIL -->

      <hr>
      <p>Já possui uma conta? <a href="login.html">Faça login</a></p
    </form>
  </main>
</body>
